name: Reusable Release Docker and Security

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
        description: 'Release tag (e.g., v1.2.3 or v1.2.3-rc1)'
      commit:
        type: string
        required: true
        description: 'Full commit SHA'
      is_rc:
        type: string
        required: true
        description: 'Whether this is a release candidate (true/false)'
      image_name:
        type: string
        required: true
        description: 'Docker image name (e.g., server, server-rc)'
      image_repo:
        type: string
        required: true
        description: 'Full GHCR image repository path'
      sbom_file:
        type: string
        required: true
        description: 'SBOM output filename'
      dockerfile:
        type: string
        required: false
        default: 'docker/Dockerfile'
      context:
        type: string
        required: false
        default: '.'

permissions: {}

jobs:

  ################################################
  # Build Docker image
  ################################################
  docker:
    name: Build and Publish Docker Image
    permissions:
      contents: read # required for checkout
      packages: write # for pushing image to GHCR
      id-token: write # for publish-ghcr action needed
      attestations: write # for publish-ghcr action needed
      artifact-metadata: write # for build provenance storage record
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io/open-crypto-broker
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docker image and push
        id: build
        uses: open-crypto-broker/.github/actions/publish-ghcr@main # nolint # zizmor: ignore[unpinned-uses]
        with:
          is_rc: ${{ inputs.is_rc }}
          registry: ghcr.io/open-crypto-broker
          image_name: ${{ inputs.image_name }}
          image_tag: ${{ inputs.tag }}
          image_sha: ${{ inputs.commit }}
          dockerfile: ${{ inputs.dockerfile }}
          context: ${{ inputs.context }}

      - name: Print digest
        run: echo "Digest=${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

  ################################################
  # SBOM + Security Scan
  ################################################
  security:
    name: SBOM Generation and Security Scan
    needs: docker
    permissions:
      contents: write # for uploading SBOM to release page
      packages: write # for SBOM upload to release page
      id-token: write # for ORAS login to GHCR
      attestations: write # for attaching SBOM as OCI referrer
      artifact-metadata: write # for uploading SBOM as release artifact
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image reference
        id: image
        run: |
          echo "ref=${IMAGE_REPO}@${DIGEST}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_REPO: ${{ inputs.image_repo }}
          DIGEST: ${{ needs.docker.outputs.digest }}

      - name: Debug image
        run: |
          echo "Image ref: ${IMAGE_REF}"
          docker pull "${IMAGE_REF}"
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.image.outputs.ref }}
          format: spdx-json
          output-file: ${{ inputs.sbom_file }}
          upload-release-assets: false

      - name: Scan image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.image.outputs.ref }}
          fail-build: true
          severity-cutoff: high # Only fail the image scan for high and above vulnerabilities
          only-fixed: true # gate only on vulnerabilities that have a fix available

      - name: Upload SBOM to GitHub Release
        if: inputs.is_rc != 'true'
        run: gh release upload "$GITHUB_REF_NAME" "$SBOM_FILE" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SBOM_FILE: ${{ inputs.sbom_file }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest SBOM to image (signed)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ inputs.image_repo }}
          subject-digest: ${{ needs.docker.outputs.digest }}
          sbom-path: ${{ inputs.sbom_file }}
          push-to-registry: true
